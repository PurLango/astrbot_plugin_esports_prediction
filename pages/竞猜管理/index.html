<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>电竞竞猜管理</title>
  <link rel="stylesheet" href="./app.css" />
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div><span class="eyebrow">ASTRBOT · ESPORTS</span><h1>电竞竞猜管理</h1><p>赛程同步、倍率状态、下注与结算</p></div>
    <div class="top-actions"><span id="connection" class="pill">连接中</span><button id="refresh" type="button">刷新</button><button id="sync" class="primary" type="button">立即同步</button></div>
  </header>

  <main>
    <section id="metrics" class="metrics"></section>

    <section class="panel settings-panel">
      <div class="panel-heading"><div><span class="eyebrow">DATA SOURCE</span><h2>同步设置</h2></div><button id="saveSettings" class="primary" type="button">保存设置</button></div>
      <div class="form-grid">
        <label><span>PandaScore Token</span><input id="token" type="password" autocomplete="off" placeholder="留空则保持现有 Token" /></label>
        <label><span>同步间隔（分钟）</span><input id="syncInterval" type="number" min="2" /></label>
        <label class="wide"><span>关注赛事关键词（每行一个）</span><textarea id="competitions" rows="4"></textarea></label>
      </div>
      <div class="switches"><label><input id="enabled" type="checkbox" />启用竞猜</label><label><input id="syncEnabled" type="checkbox" />自动同步与结算</label><label><input id="gameLol" type="checkbox" />英雄联盟</label><label><input id="gameValorant" type="checkbox" />无畏契约</label></div>
    </section>

    <section class="panel">
      <div class="panel-heading"><div><span class="eyebrow">MANUAL FALLBACK</span><h2>手动添加比赛</h2></div><button id="addMatch" type="button">添加</button></div>
      <div class="form-grid five">
        <label><span>游戏</span><select id="newGame"><option value="lol">英雄联盟</option><option value="valorant">无畏契约</option></select></label>
        <label><span>赛事</span><input id="newCompetition" placeholder="LPL 2026" /></label>
        <label><span>队伍 A</span><input id="newTeamA" /></label>
        <label><span>队伍 B</span><input id="newTeamB" /></label>
        <label><span>北京时间</span><input id="newStart" type="datetime-local" /></label>
      </div>
    </section>

    <section class="panel">
      <div class="panel-heading"><div><span class="eyebrow">MATCHES</span><h2>比赛与结算</h2></div><input id="matchSearch" class="search" type="search" placeholder="搜索编号、赛事或队伍" /></div>
      <div class="table-wrap"><table><thead><tr><th>比赛</th><th>时间</th><th>模型倍率 / 投注</th><th>状态</th><th>操作</th></tr></thead><tbody id="matchRows"></tbody></table></div>
    </section>

    <section class="panel">
      <div class="panel-heading"><div><span class="eyebrow">BETS</span><h2>最近下注</h2></div></div>
      <div class="table-wrap"><table><thead><tr><th>比赛</th><th>用户</th><th>选择</th><th>本金</th><th>倍率</th><th>状态 / 返还</th></tr></thead><tbody id="betRows"></tbody></table></div>
    </section>
  </main>
  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
</body>
</html>
